name: Build and Verify Cloud App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Production Vite Build
        run: npm run build

      - name: Verify Server Entrypoint
        run: npx tsx -e "console.log('Server entrypoint verified')"
